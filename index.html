<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceará Utilidades</title>

<link rel="icon" type="image/png" href="favicon/favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon/favicon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#ffd400;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.container{
  width:100%;
  max-width:480px;
  text-align:center;
}

.logo-box{
  width:175px;
  height:175px;
  margin:0 auto 22px;
  border-radius:50%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(180,0,0,.25);
  border:4px solid #c40000;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  color:#c40000;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  color:#a00000;
  font-size:15px;
  font-weight:600;
  margin-bottom:24px;
}

.info{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:#c40000;
  font-size:15px;
  font-weight:700;
  margin-bottom:10px;
}

.info i{
  font-size:18px;
  color:#c40000;
}

.links{
  margin-top:28px;
}

.link{
  width:100%;
  height:62px;
  border-radius:18px;
  margin-bottom:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:13px;
  text-decoration:none;
  background:#c40000;
  color:#ffd400;
  font-size:17px;
  font-weight:800;
  border:2px solid #8b0000;
  box-shadow:0 10px 25px rgba(140,0,0,.25);
  transition:.25s ease;
}

.link:hover{
  transform:translateY(-3px);
  background:#a80000;
}

.link i{
  font-size:23px;
}

.footer{
  margin-top:22px;
  color:#c40000;
  font-size:13px;
  font-weight:700;
}

@media(max-width:480px){
  .logo-box{
    width:150px;
    height:150px;
  }

  h1{
    font-size:29px;
  }

  .link{
    height:58px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo-box">
    <img src="logo.jpg" alt="Ceará Utilidades">
  </div>

  <h1>Ceará Utilidades</h1>

  <p class="subtitle">
    Tudo que você precisa em um só lugar.
  </p>

  <div class="info">
    <i class="fa-solid fa-location-dot"></i>
    <span>Goiânia - GO</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-store"></i>
    <span>Loja física em breve</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-envelope"></i>
    <span>ceara.utilidadespb@gmail.com</span>
  </div>

  <div class="links">

    <a class="link" href="https://wa.me/message/P2WGXAOBKQKNP1" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
      WhatsApp
    </a>

    <a class="link" href="#" target="_blank">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <a class="link" href="#" target="_blank">
      <i class="fa-brands fa-facebook-f"></i>
      Facebook
    </a>

    <a class="link" href="mailto:ceara.utilidadespb@gmail.com">
      <i class="fa-solid fa-envelope"></i>
      Gmail
    </a>

  </div>

  <div class="footer">
    © 2026 Ceará Utilidades
  </div>

</div>

</body>
</html>
