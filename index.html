<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceará Utilidades</title>

<link rel="icon" type="image/png" href="favicon/favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon/favicon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  min-height:100vh;
  background:#ffd400;
  display:flex;
  justify-content:center;
  padding:32px 18px;
}

.page{
  width:100%;
  max-width:520px;
  text-align:center;
}

.logo-box{
  width:178px;
  height:178px;
  margin:0 auto 22px;
  border-radius:50%;
  background:#fff;
  border:5px solid #fff;
  box-shadow:0 10px 35px rgba(150,0,0,.22);
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  color:#d60000;
  font-size:36px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  color:#333;
  font-size:16px;
  font-weight:600;
  margin-bottom:10px;
}

.location{
  color:#777;
  font-size:14px;
  font-weight:600;
  margin-bottom:28px;
}

.location i{
  color:#d60000;
  margin-right:6px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:16px;
  text-align:left;
  box-shadow:0 10px 25px rgba(0,0,0,.13);
}

.card-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.card-icon i{
  color:#d60000;
  font-size:20px;
}

.card h3{
  color:#222;
  font-size:19px;
  font-weight:800;
}

.card p{
  color:#666;
  font-size:14px;
  font-weight:500;
}

.card strong{
  color:#d60000;
}

.whatsapp{
  background:linear-gradient(135deg,#e60000,#ff3030);
}

.whatsapp a{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  color:#fff;
  text-decoration:none;
}

.whatsapp .card-icon{
  background:rgba(255,255,255,.18);
}

.whatsapp i,
.whatsapp h3,
.whatsapp p{
  color:#fff;
}

.social-card{
  flex-direction:column;
  text-align:center;
}

.social-icons{
  display:flex;
  justify-content:center;
  gap:20px;
}

.social{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:27px;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  transition:.25s;
}

.social:hover{
  transform:translateY(-3px);
}

.instagram{color:#E1306C}
.facebook{color:#1877F2}

.footer{
  margin-top:32px;
  background:linear-gradient(90deg,#e60000,#ff3030,#ffd400);
  color:#fff;
  padding:24px 12px;
  font-size:13px;
  font-weight:600;
  border-radius:0;
}

.footer strong{
  display:block;
  font-size:15px;
  margin-bottom:3px;
}

@media(max-width:480px){
  h1{font-size:31px}
  .logo-box{width:150px;height:150px}
  .card{padding:19px}
}
</style>
</head>

<body>

<div class="page">

  <div class="logo-box">
    <img src="logo.jpg" alt="Ceará Utilidades">
  </div>

  <h1>Ceará Utilidades</h1>

  <p class="subtitle">Tudo o que você precisa em um só lugar!</p>

  <p class="location">
    <i class="fa-solid fa-location-dot"></i>
    Goiânia - GO
  </p>

  <div class="card whatsapp">
    <a href="https://wa.me/message/P2WGXAOBKQKNP1" target="_blank">
      <div class="card-icon">
        <i class="fa-brands fa-whatsapp"></i>
      </div>
      <div>
        <h3>WhatsApp</h3>
        <p>Atendimento rápido e direto</p>
      </div>
    </a>
  </div>

  <div class="card">
    <div class="card-icon">
      <i class="fa-solid fa-store"></i>
    </div>
    <div>
      <h3>Loja Física</h3>
      <p><strong>Em breve</strong> em Goiânia - GO</p>
    </div>
  </div>

  <div class="card">
    <div class="card-icon">
      <i class="fa-solid fa-envelope"></i>
    </div>
    <div>
      <h3>Contato</h3>
      <p>ceara.utilidadespb@gmail.com</p>
    </div>
  </div>

  <div class="card social-card">
    <div class="social-icons">
      <a href="#" class="social instagram" target="_blank">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="#" class="social facebook" target="_blank">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
    </div>

    <p>Siga-nos para promoções exclusivas!</p>
  </div>

  <div class="footer">
    <strong>© 2026 Ceará Utilidades</strong>
    Todos os direitos reservados
  </div>

</div>

</body>
</html>
