<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceará Utilidades</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(255,196,0,.18), transparent 35%),
    linear-gradient(135deg,#080808,#151515,#0b0b0b);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  color:#fff;
}

.container{
  width:100%;
  max-width:480px;
  text-align:center;
}

.logo-box{
  width:190px;
  height:190px;
  margin:0 auto 18px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:.5px;
}

.subtitle{
  font-size:15px;
  color:#d4d4d4;
  margin-bottom:22px;
}

.info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#f5f5f5;
  font-size:15px;
  margin-bottom:10px;
}

.info i{
  color:#ffcc00;
  font-size:17px;
}

.links{
  margin-top:26px;
}

.link{
  width:100%;
  height:62px;
  border-radius:20px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:700;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  transition:.25s ease;
}

.link:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.14);
}

.link i{
  font-size:23px;
}

.whatsapp i{color:#25D366;}
.instagram i{color:#E1306C;}
.facebook i{color:#1877F2;}
.gmail i{color:#EA4335;}

.footer{
  margin-top:22px;
  font-size:13px;
  color:#aaa;
}

@media(max-width:480px){
  .logo-box{
    width:160px;
    height:160px;
  }

  h1{
    font-size:29px;
  }

  .link{
    height:58px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo-box">
    <img src="logo.jpg" alt="Ceará Utilidades">
  </div>

  <h1>Ceará Utilidades</h1>

  <p class="subtitle">
    Utilidades para casa, cozinha, organização e decoração.
  </p>

  <div class="info">
    <i class="fa-solid fa-location-dot"></i>
    <span>Goiânia - GO</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-store"></i>
    <span>Loja física em breve</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-envelope"></i>
    <span>ceara.utilidadespb@gmail.com</span>
  </div>

  <div class="links">

    <a class="link whatsapp" href="https://wa.me/message/P2WGXAOBKQKNP1" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
      WhatsApp
    </a>

    <a class="link instagram" href="#" target="_blank">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <a class="link facebook" href="#" target="_blank">
      <i class="fa-brands fa-facebook-f"></i>
      Facebook
    </a>

    <a class="link gmail" href="mailto:ceara.utilidadespb@gmail.com">
      <i class="fa-solid fa-envelope"></i>
      Gmail
    </a>

  </div>

  <div class="footer">
    © 2026 Ceará Utilidades
  </div>

</div>

</body>
</html>
