<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceará Utilidades</title>

<link rel="icon" href="favicon.png" type="image/png">
<link rel="shortcut icon" href="favicon.png" type="image/png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(255,220,0,.35), transparent 34%),
    linear-gradient(180deg,#ffd400 0%,#ffbf00 45%,#f01818 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  color:#1b1b1b;
}

.container{
  width:100%;
  max-width:480px;
  text-align:center;
}

.logo-box{
  width:185px;
  height:185px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 18px 45px rgba(120,0,0,.30);
  overflow:hidden;
  border:5px solid rgba(255,255,255,.85);
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:34px;
  font-weight:800;
  color:#d90000;
  margin-bottom:8px;
  text-shadow:0 2px 0 rgba(255,255,255,.45);
}

.subtitle{
  font-size:15px;
  color:#3b2b00;
  font-weight:500;
  margin-bottom:22px;
}

.info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:#3a2500;
  font-size:15px;
  font-weight:600;
  margin-bottom:9px;
}

.info i{
  color:#d90000;
  font-size:18px;
}

.links{
  margin-top:28px;
}

.link{
  width:100%;
  height:64px;
  border-radius:20px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:800;
  background:linear-gradient(135deg,#e90000,#ff3131);
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 12px 28px rgba(120,0,0,.28);
  transition:.25s ease;
}

.link:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 35px rgba(100,0,0,.35);
}

.link i{
  font-size:24px;
}

.whatsapp{
  background:linear-gradient(135deg,#14b84a,#25D366);
}

.instagram{
  background:linear-gradient(135deg,#ff0069,#ffb000);
}

.facebook{
  background:linear-gradient(135deg,#005bea,#1877F2);
}

.gmail{
  background:linear-gradient(135deg,#c40000,#ff2d2d);
}

.footer{
  margin-top:24px;
  font-size:13px;
  font-weight:600;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}

@media(max-width:480px){
  .logo-box{
    width:155px;
    height:155px;
  }

  h1{
    font-size:29px;
  }

  .link{
    height:59px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo-box">
    <img src="logo.jpg" alt="Ceará Utilidades">
  </div>

  <h1>Ceará Utilidades</h1>

  <p class="subtitle">
    Tudo que você precisa em um só lugar.
  </p>

  <div class="info">
    <i class="fa-solid fa-location-dot"></i>
    <span>Goiânia - GO</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-store"></i>
    <span>Loja física em breve</span>
  </div>

  <div class="info">
    <i class="fa-solid fa-envelope"></i>
    <span>ceara.utilidadespb@gmail.com</span>
  </div>

  <div class="links">

    <a class="link whatsapp" href="https://wa.me/message/P2WGXAOBKQKNP1" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
      WhatsApp
    </a>

    <a class="link instagram" href="#" target="_blank">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <a class="link facebook" href="#" target="_blank">
      <i class="fa-brands fa-facebook-f"></i>
      Facebook
    </a>

    <a class="link gmail" href="mailto:ceara.utilidadespb@gmail.com">
      <i class="fa-solid fa-envelope"></i>
      Gmail
    </a>

  </div>

  <div class="footer">
    © 2026 Ceará Utilidades
  </div>

</div>

</body>
</html>
